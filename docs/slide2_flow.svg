<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Luồng xử lý Escalation Referee</title>
  <desc id="desc">Email đi qua xử lý, tách thành trả lời tự động hoặc chuyển tiếp; hai điểm con người quyết định được đánh dấu rõ.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>
      .box{fill:#f0fdfa;stroke:#0f766e;stroke-width:3;rx:18}.human{fill:#fff7ed;stroke:#c2410c;stroke-width:3;rx:18}
      .t{font:700 25px sans-serif;fill:#134e4a}.s{font:18px sans-serif;fill:#334155}.h{font:700 22px sans-serif;fill:#9a3412}
      .a{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="box" x="30" y="115" width="210" height="110"/><text class="t" x="75" y="160">ĐẦU VÀO</text><text class="s" x="60" y="195">Email sinh viên</text>
  <path class="a" d="M240 170 H330"/>
  <rect class="box" x="330" y="80" width="250" height="180"/><text class="t" x="385" y="130">XỬ LÝ</text><text class="s" x="365" y="165">Tìm căn cứ</text><text class="s" x="365" y="195">Áp dụng quy định</text><text class="s" x="365" y="225">Kiểm tra an toàn</text>
  <path class="a" d="M580 135 H670"/><path class="a" d="M580 215 H670"/>
  <rect class="box" x="670" y="45" width="235" height="100"/><text class="t" x="710" y="88">TỰ ĐỘNG</text><text class="s" x="710" y="120">Nháp có trích dẫn</text>
  <rect class="human" x="670" y="195" width="235" height="120"/><text class="h" x="695" y="235">👤 QUYẾT ĐỊNH 1</text><text class="s" x="700" y="270">Chuyên viên xử lý</text><text class="s" x="700" y="295">case chuyển tiếp</text>
  <path class="a" d="M905 95 H970"/><path class="a" d="M905 255 H970"/>
  <rect class="human" x="970" y="105" width="205" height="145"/><text class="h" x="990" y="150">👤 QUYẾT ĐỊNH 2</text><text class="s" x="1005" y="185">Dừng trong 60s</text><text class="s" x="1005" y="215">hoặc duyệt gửi</text>
</svg>
