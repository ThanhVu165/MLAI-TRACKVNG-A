version: 1
fallback_templates:
  FACT_UNRESOLVED:
    summary: "Hồ sơ chưa đủ dữ kiện thực tế để hệ thống tự động xác định quy định áp dụng."
    facts:
      - "Sinh viên gửi yêu cầu qua kênh tiếp nhận nhưng còn thiếu thông tin cần thiết."
      - "Hệ thống dừng xử lý tự động để tránh suy đoán sai lệch."
    basis:
      - breadcrumb: "Quy chế Công tác Sinh viên"
        quote: "Mọi thủ tục hành chính chỉ được giải quyết khi sinh viên cung cấp đủ hồ sơ hợp lệ."
    question: "Chuyên viên yêu cầu sinh viên bổ sung thông tin gì để có cơ sở giải quyết?"
    options:
      - "Yêu cầu cung cấp minh chứng và thông tin cụ thể"
      - "Hướng dẫn sinh viên tra cứu lại quy định hiện hành"
      - "Từ chối tiếp nhận do thiếu dữ kiện bắt buộc"

  OUT_OF_POLICY:
    summary: "Yêu cầu nằm ngoài phạm vi quy định hoặc chưa có căn cứ văn bản đang hiệu lực."
    facts:
      - "Nội dung yêu cầu không thuộc 3 nhóm quy định thường quy được hỗ trợ tự động."
      - "Không tìm thấy điều khoản đang hiệu lực cho phép xử lý tự động nội dung này."
    basis:
      - breadcrumb: "Phạm vi hỗ trợ tự động DSA"
        quote: "Không tìm thấy quy định đang hiệu lực cho nội dung yêu cầu."
    question: "Chuyên viên hướng dẫn sinh viên liên hệ đơn vị nào hoặc xử lý ra sao?"
    options:
      - "Chuyển tiếp yêu cầu sang phòng ban chuyên trách liên quan"
      - "Phản hồi hướng dẫn thủ tục trực tiếp tại văn phòng"
      - "Từ chối tiếp nhận vì ngoài thẩm quyền của đơn vị"

  AUTHORITY_REQUIRED:
    summary: "Yêu cầu liên quan đến hồ sơ cá nhân, xin ngoại lệ, khiếu nại hoặc cần người phê duyệt."
    facts:
      - "Yêu cầu chạm đến thẩm quyền quyết định cá biệt của lãnh đạo hoặc chuyên viên phụ trách."
      - "Quy định bắt buộc phải có sự xác nhận của người có thẩm quyền."
    basis:
      - breadcrumb: "Quy định phân cấp thẩm quyền giải quyết việc sinh viên"
        quote: "Các trường hợp đặc biệt, xin ngoại lệ hoặc khiếu nại phải do chuyên viên/lãnh đạo phê duyệt."
    question: "Chuyên viên có đồng ý phê duyệt ngoại lệ hoặc xem xét trường hợp này không?"
    options:
      - "Đồng ý phê duyệt trường hợp đặc biệt này"
      - "Từ chối giải quyết vì không đủ điều kiện ngoại lệ"
      - "Chuyển hồ sơ lên Trưởng phòng phê duyệt"
